name: Build EduTech Mindset APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Android APK (Full Permissions + Overlay)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android Project & Full Permissions (SYSTEM_ALERT_WINDOW)
        run: |
          if [ ! -f "app/build.gradle.kts" ] && [ ! -f "app/build.gradle" ]; then
            mkdir -p app/src/main/java/com/edutech/mindset
            mkdir -p app/src/main/res/values
            mkdir -p app/src/main/res/drawable

            cat << 'EOF' > settings.gradle.kts
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "EduTech Mindset"
          include(":app")
          EOF

            cat << 'EOF' > build.gradle.kts
          plugins {
            id("com.android.application") version "8.7.2" apply false
            id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

            cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

            cat << 'EOF' > app/build.gradle.kts
          plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
          }
          android {
            namespace = "com.aistudio.edutechmindset.bfkqaz"
            compileSdk = 35
            defaultConfig {
              applicationId = "com.aistudio.edutechmindset.bfkqaz"
              minSdk = 24
              targetSdk = 35
              versionCode = 1
              versionName = "1.0"
            }
            signingConfigs {
              create("release") {
                storeFile = file("${rootDir}/my-upload-key.jks")
                storePassword = "edutech123"
                keyAlias = "upload"
                keyPassword = "edutech123"
              }
            }
            buildTypes {
              release {
                isMinifyEnabled = false
                signingConfig = signingConfigs.getByName("release")
              }
              debug {
                signingConfig = signingConfigs.getByName("release")
              }
            }
            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
              jvmTarget = "17"
            }
            lint {
              checkReleaseBuilds = false
              abortOnError = false
            }
          }
          dependencies {
            implementation("androidx.core:core-ktx:1.15.0")
            implementation("androidx.appcompat:appcompat:1.7.0")
            implementation("com.google.android.material:material:1.12.0")
            implementation("androidx.activity:activity-ktx:1.9.3")
            implementation("androidx.webkit:webkit:1.12.1")
          }
          EOF

            cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">EduTech Mindset</string>
          </resources>
          EOF

            cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" tools:ignore="ScopedStorage" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">

                  <activity
                      android:name="com.edutech.mindset.MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:supportsPictureInPicture="true"
                      android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name="com.edutech.mindset.FloatingOverlayService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="floating_educational_overlay_assistant" />
                  </service>
              </application>
          </manifest>
          EOF

            cat << 'EOF' > app/src/main/java/com/edutech/mindset/FloatingOverlayService.kt
          package com.edutech.mindset

          import android.annotation.SuppressLint
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.CountDownTimer
          import android.os.IBinder
          import android.provider.Settings
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.core.app.NotificationCompat
          import java.util.Locale
          import kotlin.math.abs

          class FloatingOverlayService : Service() {
              private var windowManager: WindowManager? = null
              private var rootView: View? = null
              private var timer: CountDownTimer? = null
              private var secondsLeft = 25 * 60
              private var running = false

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  startForegroundNotification()
                  if (Settings.canDrawOverlays(this)) {
                      showOverlay()
                  } else {
                      stopSelf()
                  }
              }

              override fun onDestroy() {
                  timer?.cancel()
                  rootView?.let { runCatching { windowManager?.removeView(it) } }
                  rootView = null
                  super.onDestroy()
              }

              private fun startForegroundNotification() {
                  val channelId = "edutech_overlay"
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      nm.createNotificationChannel(
                          NotificationChannel(channelId, "EduTech Overlay", NotificationManager.IMPORTANCE_LOW)
                      )
                  }
                  val pi = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val notif = NotificationCompat.Builder(this, channelId)
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle("EduTech Mindset • النافذة العائمة نشطة")
                      .setContentText("اضغط للعودة إلى المنصة")
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                      startForeground(4401, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(4401, notif)
                  }
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun showOverlay() {
                  val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  windowManager = wm
                  val type = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  else
                      @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      type,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = dp(16)
                      y = dp(140)
                  }

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutDirection = View.LAYOUT_DIRECTION_RTL
                  }

                  val bubble = TextView(this).apply {
                      text = "🎓 EduTech"
                      setTextColor(Color.parseColor("#07111E"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 13f)
                      typeface = Typeface.DEFAULT_BOLD
                      setPadding(dp(14), dp(10), dp(14), dp(10))
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TL_BR,
                          intArrayOf(Color.parseColor("#00D4FF"), Color.parseColor("#FFB703"))
                      ).apply {
                          cornerRadius = dp(28).toFloat()
                          setStroke(dp(2), Color.WHITE)
                      }
                  }

                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      visibility = View.GONE
                      setPadding(dp(14), dp(12), dp(14), dp(12))
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#F20A1628"))
                          cornerRadius = dp(20).toFloat()
                          setStroke(dp(2), Color.parseColor("#00D4FF"))
                      }
                  }

                  val header = TextView(this).apply {
                      text = "EduTech Mindset • أ. باسل الفقعاوي"
                      setTextColor(Color.parseColor("#00D4FF"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f)
                      typeface = Typeface.DEFAULT_BOLD
                  }

                  val clockView = TextView(this).apply {
                      text = "25:00"
                      setTextColor(Color.WHITE)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 20f)
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      setPadding(0, dp(6), 0, dp(6))
                  }

                  val toggleTimerBtn = TextView(this).apply {
                      text = "▶ بدء/إيقاف المؤقت"
                      setTextColor(Color.parseColor("#07111E"))
                      gravity = Gravity.CENTER
                      setPadding(dp(10), dp(6), dp(10), dp(6))
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#00D4FF"))
                          cornerRadius = dp(10).toFloat()
                      }
                      setOnClickListener {
                          if (running) {
                              timer?.cancel()
                              running = false
                          } else {
                              running = true
                              timer = object : CountDownTimer(secondsLeft * 1000L, 1000L) {
                                  override fun onTick(ms: Long) {
                                      secondsLeft = (ms / 1000L).toInt()
                                      clockView.text = String.format(Locale.US, "%02d:%02d", secondsLeft / 60, secondsLeft % 60)
                                  }
                                  override fun onFinish() {
                                      secondsLeft = 25 * 60
                                      running = false
                                      clockView.text = "00:00 ✓"
                                  }
                              }.start()
                          }
                      }
                  }

                  val openBtn = TextView(this).apply {
                      text = "فتح المنصة"
                      setTextColor(Color.parseColor("#07111E"))
                      gravity = Gravity.CENTER
                      setPadding(dp(10), dp(6), dp(10), dp(6))
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#FFB703"))
                          cornerRadius = dp(10).toFloat()
                      }
                      setOnClickListener {
                          startActivity(Intent(this@FloatingOverlayService, MainActivity::class.java).apply {
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                          })
                          card.visibility = View.GONE
                          bubble.visibility = View.VISIBLE
                      }
                  }

                  val closeBtn = TextView(this).apply {
                      text = "➖ تصغير / ✖ إغلاق"
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(dp(10), dp(6), dp(10), dp(6))
                      setOnClickListener {
                          card.visibility = View.GONE
                          bubble.visibility = View.VISIBLE
                      }
                      setOnLongClickListener {
                          stopSelf()
                          true
                      }
                  }

                  card.addView(header)
                  card.addView(clockView)
                  card.addView(toggleTimerBtn)
                  card.addView(openBtn, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { topMargin = dp(6) })
                  card.addView(closeBtn, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { topMargin = dp(6) })

                  root.addView(bubble)
                  root.addView(card)

                  val drag = object : View.OnTouchListener {
                      var ix = 0; var iy = 0; var tx = 0f; var ty = 0f; var moved = false
                      override fun onTouch(v: View?, e: MotionEvent): Boolean {
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> { ix = params.x; iy = params.y; tx = e.rawX; ty = e.rawY; moved = false; return true }
                              MotionEvent.ACTION_MOVE -> {
                                  val dx = (e.rawX - tx).toInt(); val dy = (e.rawY - ty).toInt()
                                  if (abs(dx) > dp(6) || abs(dy) > dp(6)) moved = true
                                  params.x = ix + dx; params.y = iy + dy
                                  runCatching { wm.updateViewLayout(root, params) }
                                  return true
                              }
                              MotionEvent.ACTION_UP -> {
                                  if (!moved && v == bubble) {
                                      bubble.visibility = View.GONE
                                      card.visibility = View.VISIBLE
                                  }
                                  return true
                              }
                          }
                          return false
                      }
                  }
                  bubble.setOnTouchListener(drag)
                  header.setOnTouchListener(drag)

                  wm.addView(root, params)
                  rootView = root
              }

              private fun dp(v: Int): Int = TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v.toFloat(), resources.displayMetrics).toInt()
          }
          EOF

            cat << 'EOF' > app/src/main/java/com/edutech/mindset/MainActivity.kt
          package com.edutech.mindset

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.PictureInPictureParams
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.util.Rational
          import android.view.Gravity
          import android.view.View
          import android.webkit.PermissionRequest
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.result.contract.ActivityResultContracts

          class MainActivity : ComponentActivity() {
              private lateinit var webView: WebView
              private var filePathCallback: ValueCallback<Array<Uri>>? = null

              private val permissionLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { }

              private val fileChooserLauncher = registerForActivityResult(
                  ActivityResultContracts.GetMultipleContents()
              ) { uris ->
                  filePathCallback?.onReceiveValue(uris.toTypedArray())
                  filePathCallback = null
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  requestAllRuntimePermissions()

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutDirection = View.LAYOUT_DIRECTION_RTL
                      setBackgroundColor(Color.parseColor("#07111E"))
                  }

                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(16, 12, 16, 12)
                      setBackgroundColor(Color.parseColor("#0F172A"))
                  }

                  val overlayBtn = Button(this).apply {
                      text = "النافذة العائمة فوق التطبيقات"
                      setOnClickListener {
                          if (!Settings.canDrawOverlays(this@MainActivity)) {
                              Toast.makeText(this@MainActivity, "يرجى تفعيل إذن الظهور فوق التطبيقات لـ EduTech Mindset", Toast.LENGTH_LONG).show()
                              startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                          } else {
                              val svc = Intent(this@MainActivity, FloatingOverlayService::class.java)
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(svc) else startService(svc)
                              Toast.makeText(this@MainActivity, "تم تشغيل فقاعة EduTech العائمة فوق التطبيقات ✓", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }

                  val pipBtn = Button(this).apply {
                      text = "نافذة مصغّرة PiP"
                      setOnClickListener {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              runCatching {
                                  enterPictureInPictureMode(PictureInPictureParams.Builder().setAspectRatio(Rational(16, 9)).build())
                              }
                          }
                      }
                  }

                  topBar.addView(overlayBtn, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  topBar.addView(pipBtn, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT))

                  webView = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.databaseEnabled = true
                      settings.allowFileAccess = true
                      settings.allowContentAccess = true
                      settings.mediaPlaybackRequiresUserGesture = false
                      settings.cacheMode = WebSettings.LOAD_DEFAULT
                      webViewClient = WebViewClient()
                      webChromeClient = object : WebChromeClient() {
                          override fun onPermissionRequest(request: PermissionRequest?) {
                              request?.grant(request.resources)
                          }
                          override fun onShowFileChooser(
                              webView: WebView?,
                              callback: ValueCallback<Array<Uri>>?,
                              fileChooserParams: FileChooserParams?
                          ): Boolean {
                              filePathCallback?.onReceiveValue(null)
                              filePathCallback = callback
                              fileChooserLauncher.launch("*/*")
                              return true
                          }
                      }
                      loadUrl("https://edutech-mindset.pages.dev")
                  }

                  root.addView(topBar, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))
                  root.addView(webView, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))
                  setContentView(root)

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (webView.canGoBack()) webView.goBack() else finish()
                      }
                  })
              }

              private fun requestAllRuntimePermissions() {
                  val perms = mutableListOf(
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.CAMERA
                  )
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      perms.add(Manifest.permission.POST_NOTIFICATIONS)
                      perms.add(Manifest.permission.READ_MEDIA_IMAGES)
                      perms.add(Manifest.permission.READ_MEDIA_VIDEO)
                      perms.add(Manifest.permission.READ_MEDIA_AUDIO)
                  } else {
                      perms.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                  }
                  permissionLauncher.launch(perms.toTypedArray())
              }
          }
          EOF
          fi

          if [ ! -f ".env" ]; then
            echo "GEMINI_API_KEY=" > .env
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v -keystore my-upload-key.jks -storepass edutech123 -alias upload -keypass edutech123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Basel Ashraf Alfakawi,OU=EduTech Mindset,O=EduTech Mindset,L=Khan Yunis,C=PS"
          fi

      - name: Build Signed APK
        env:
          STORE_PASSWORD: edutech123
          KEY_PASSWORD: edutech123
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace
          mkdir -p dist-apk
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} dist-apk/EduTech-Mindset-Debug.apk \;
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist-apk/EduTech-Mindset-Release-Signed.apk \;
          ls -lh dist-apk/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EduTech-Mindset-APK-Files
          path: dist-apk/*.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "EduTech Mindset APK v1.0.${{ github.run_number }} (صلاحيات كاملة + الظهور فوق التطبيقات)"
          files: dist-apk/*.apk
