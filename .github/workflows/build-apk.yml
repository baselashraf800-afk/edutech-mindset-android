name: Build EduTech Mindset APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Android APK (Full Permissions + Overlay)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unpack Android Project & Generate Keystores
        run: |
          echo "" | base64 -d | tar -xzf -
          keytool -genkeypair -v -keystore my-upload-key.jks -storepass edutech123 -alias upload -keypass edutech123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Basel Ashraf Alfakawi,OU=EduTech Mindset,O=EduTech Mindset,L=Khan Yunis,C=PS"

      - name: Build Signed APK
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk dist-apk/EduTech-Mindset-Debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist-apk/EduTech-Mindset-Release-Signed.apk
          ls -lh dist-apk/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EduTech-Mindset-APK-Files
          path: dist-apk/*.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "EduTech Mindset APK v2.0.${{ github.run_number }} (صلاحيات كاملة + الظهور فوق التطبيقات)"
          files: dist-apk/*.apk
